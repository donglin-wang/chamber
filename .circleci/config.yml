version: 2.1

jobs:
  test-packages:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Set up Ubuntu for rootless Chamber execution
          command: |
            sudo ./scripts/setup-host.sh --allow-unrestricted-userns chamber-test
            # Make the executor's selected Go toolchain available to the new user.
            go_root=$(go env GOROOT)
            sudo mkdir -p /opt/chamber-go
            sudo cp -a "$go_root/." /opt/chamber-go/
            sudo install -d -o chamber-test -g chamber-test /home/chamber-test/source
            tar --exclude=.git -cf - . | sudo -u chamber-test tar -C /home/chamber-test/source -xf -
      - run:
          name: Run local-test on the Ubuntu VM
          no_output_timeout: 25m
          command: |
            sudo -iu chamber-test bash -s \<<'TEST'
            set -euo pipefail
            export PATH=/opt/chamber-go/bin:/usr/local/bin:/usr/bin:/bin
            cd "$HOME/source"
            go run ./cmd/local-test
            TEST

workflows:
  packages:
    jobs:
      - test-packages
